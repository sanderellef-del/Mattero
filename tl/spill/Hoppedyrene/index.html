<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hoppedyrene</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: chunky toy-like panels on a pale sky; the collected animals stand on the top edge of the number-line panel and watch. One light look for every classroom device. */
:root{
  --sky:#E3F1F9;
  --paper:#FFFFFF;
  --ink:#1D2B4F;
  --ink-soft:#56668A;
  --rule:#C5D8E6;
  --sil:#BFD0DE;
  --sun:#FFC83A;
  --sun-deep:#D69A00;
  --hop:#2F7FE0;
  --hop2:#E0457B;
  --good:#22A15E;
  --good-deep:#17804A;
  --good-soft:#DCF4E6;
  --try:#EF8418;
  --try-deep:#A65400;
  --try-soft:#FFEBD4;
  --f-play:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-read:"Andika","Verdana",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--f-read);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--hop);outline-offset:3px}

.app{max-width:1100px;margin:0 auto;padding-block:14px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Dyrene */
.eye{transform-box:fill-box;transform-origin:center;animation:eyeblink 5.2s infinite;animation-delay:var(--bd,0s)}
.sil *{fill:var(--sil)!important;stroke:var(--sil)!important}
.sil .eye{animation:none}
.q{font:700 46px var(--f-play);fill:#fff;text-anchor:middle}

/* ---------- Startskjerm ---------- */
.start{padding-top:clamp(12px,4vh,44px)}
.wordmark{font:700 clamp(42px,8vw,84px)/1 var(--f-play);margin:0;letter-spacing:-.01em;text-wrap:balance}
.wordmark span{color:var(--hop)}
.hero-row{display:flex;align-items:flex-end;gap:clamp(4px,1.5vw,16px);margin-top:18px;border-bottom:5px solid var(--ink);padding-bottom:0;width:max-content;max-width:100%}
.hero-row svg{width:clamp(56px,11vw,96px);height:auto;display:block;overflow:visible}
.hero-row .now{animation:idlehop 3.2s ease-in-out infinite;transform-origin:50% 100%}
.lead{font-size:22px;color:var(--ink-soft);margin:.7em 0 .2em}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:22px}
.mode-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;
  padding:22px 24px 20px;background:var(--paper);border:3px solid var(--rule);border-radius:28px;
  box-shadow:0 7px 0 var(--rule);cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;min-width:0}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--rule)}
.mode-card:active{transform:translateY(5px);box-shadow:0 2px 0 var(--rule)}
.mode-name{font:700 clamp(28px,4vw,36px)/1.1 var(--f-play)}
.mode-ex{font:600 clamp(44px,6vw,60px)/1 var(--f-play);display:flex;gap:.25em}
.mode-ex .b{color:var(--hop)}
.mode-ex .a{text-decoration:underline .12em var(--sun);text-underline-offset:.1em;text-decoration-skip-ink:none}
.mini{width:100%;height:auto;display:block}
.mode-note{font-size:18px;color:var(--ink-soft)}
.mini-axis,.mini-tick{stroke:var(--ink);stroke-linecap:round}
.mini-axis{stroke-width:2.5}
.mini-tick{stroke-width:1.6}
.mini-tick.ten{stroke-width:2.6}
.mini-arrow{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.mini-arc{fill:none;stroke:var(--hop);stroke-width:2.2;stroke-linecap:round}
.mini-arc.after{stroke:var(--hop2)}
.mini-lbl{font:600 11px var(--f-play);fill:var(--ink-soft);text-anchor:middle}
.dot-start{fill:var(--sun)}
.dot-end{fill:var(--good)}

/* ---------- Spillskjerm ---------- */
.bar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.bar > .back,.bar > .mode-pill,.bar > .stars{margin-bottom:12px}
.back{font:600 18px var(--f-play);background:var(--paper);border:3px solid var(--rule);border-radius:999px;padding:7px 16px 7px 12px;cursor:pointer}
.back:disabled{opacity:.45;cursor:default}
.mode-pill{font:600 18px var(--f-play);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px}
.tribune-wrap{margin-left:auto;display:flex;justify-content:flex-end;min-width:0}
#tribune{height:92px;width:auto;display:block;overflow:visible}
#tribune [data-pick]{cursor:pointer}
.fan{transform-box:fill-box;transform-origin:50% 100%}
.fan.cheer{animation:cheer .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--cd,0ms)}
.fan.arrive{animation:arrive .7s cubic-bezier(.3,1.7,.5,1) both}
.stars{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--rule);
  border-radius:999px;padding:5px 16px 5px 10px;font:700 30px/1 var(--f-play);font-variant-numeric:tabular-nums}
.star-ico{width:36px;height:36px;fill:var(--sun);stroke:var(--sun-deep);stroke-width:1.4;stroke-linejoin:round}
.stars.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
.pips{display:flex;gap:3px;margin-left:6px;padding-left:10px;border-left:2px solid var(--rule)}
.pips svg{width:17px;height:17px;fill:transparent;stroke:var(--sil);stroke-width:2;stroke-linejoin:round;transition:fill .25s, stroke .25s}
.pips svg.on{fill:var(--sun);stroke:var(--sun-deep);animation:bump .45s cubic-bezier(.3,1.8,.5,1)}

.line-panel{background:var(--paper);border:3px solid var(--rule);border-radius:28px;
  box-shadow:0 6px 0 var(--rule);padding:30px 14px 4px}
#line{display:block;width:100%;height:auto;overflow:visible}
.nl-axis{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.nl-arrow{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.nl-tick{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.nl-tick.ten{stroke-width:6}
.nl-num{font-family:var(--f-play);font-weight:600;fill:var(--ink);text-anchor:middle;transition:fill .2s}
.nl-num.ten{font-weight:700}
.nl-num.on-end{fill:#fff}
.mark{transform-box:fill-box;transform-origin:center;animation:markpop .45s cubic-bezier(.3,1.7,.5,1) both}
.mark.start{fill:var(--sun)}
.mark.end{fill:var(--good)}
.arc{fill:none;stroke:var(--hop);stroke-width:5;stroke-linecap:round}
.arc.after{stroke:var(--hop2)}
.hopnum{font-family:var(--f-play);font-weight:600;fill:var(--hop);text-anchor:middle;opacity:0;transition:opacity .2s}
.hopnum.after{fill:var(--hop2)}
.hopnum.show{opacity:1}
#line.hint10 .nl-tick.ten{animation:tentick 0.9s ease-in-out infinite alternate}
#line.hint10 .nl-num.ten{animation:tennum 0.9s ease-in-out infinite alternate}
.roo-bob{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}

.play{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start;margin-top:22px}
.task-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.task-card{min-height:178px;display:grid;place-items:center;background:var(--paper);border:3px solid var(--rule);
  border-radius:28px;box-shadow:0 6px 0 var(--rule);padding:20px}
.idle-msg{margin:0;font-size:22px;color:var(--ink-soft);text-align:center;animation:fadein .4s ease both}
.idle-msg b{font-family:var(--f-play);font-weight:600;color:var(--ink)}
.idle-msg small{display:block;font-size:17px;margin-top:8px}
.expr{display:flex;align-items:center;gap:.26em;font:600 clamp(52px,9vw,96px)/1 var(--f-play)}
.tok{display:inline-block;animation:tokin .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0ms)}
.tok.op{color:var(--ink-soft)}
.tok.a{text-decoration:underline .11em var(--sun);text-underline-offset:.1em;text-decoration-skip-ink:none}
.tok.b{color:var(--hop)}
.answer{display:inline-flex;align-items:center;justify-content:center;min-width:1.75em;height:1.3em;padding:0 .14em;
  border:4px dashed var(--ink-soft);border-radius:.22em;background:#F5F9FC;font-variant-numeric:tabular-nums}
.answer.has{border-style:solid;border-color:var(--ink);background:var(--paper)}
.answer .digits{display:inline-block;transition:opacity .25s, transform .25s}
.caret{display:inline-block;width:5px;height:.78em;margin-left:3px;border-radius:3px;background:var(--hop);animation:blink 1.1s steps(2,start) infinite}
.answer.right{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good-deep);animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.answer.wrong{border-style:solid;border-color:var(--try);background:var(--try-soft);color:var(--try-deep);animation:shake .5s ease}
.answer.fade .digits{opacity:0;transform:translateY(14px) scale(.6)}
.answer.nudge{animation:nudge .3s ease}

.feedback{min-height:3.6em;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.pill{display:inline-block;font:600 24px/1.2 var(--f-play);padding:6px 18px;border-radius:999px;border:3px solid;animation:pillin .4s cubic-bezier(.3,1.7,.5,1) both}
.pill.try{background:var(--try-soft);border-color:var(--try);color:var(--try-deep)}
.pill.good{background:var(--good-soft);border-color:var(--good);color:var(--good-deep)}
.hint{margin:0;font-size:19px;line-height:1.45;max-width:36em;animation:fadein .4s ease both}

.new-btn{align-self:flex-start;font:600 28px/1 var(--f-play);padding:18px 34px;background:var(--sun);color:var(--ink);
  border:3px solid var(--sun-deep);border-radius:999px;box-shadow:0 6px 0 var(--sun-deep);cursor:pointer;transition:opacity .2s}
.new-btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--sun-deep)}
.new-btn:disabled{opacity:.35;cursor:default}
.new-btn.pulse:not(:disabled){animation:pulse 1.7s ease-in-out infinite}

.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.key{height:66px;font:600 32px/1 var(--f-play);background:var(--paper);border:3px solid var(--rule);border-radius:18px;
  box-shadow:0 5px 0 var(--rule);cursor:pointer;touch-action:manipulation;transition:opacity .2s}
.key:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--rule)}
.key.del{color:var(--ink-soft);font-size:26px}
.key.ok{background:var(--good);border-color:var(--good-deep);box-shadow:0 5px 0 var(--good-deep);color:#fff;font-size:26px}
.key.ok:active:not(:disabled){box-shadow:0 1px 0 var(--good-deep)}
.pad.off .key{opacity:.4;cursor:default}

/* Feiring */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.flystar{position:fixed;left:0;top:0;width:48px;height:48px;pointer-events:none;z-index:50}
.flystar svg{width:100%;height:100%;fill:var(--sun);stroke:var(--sun-deep);stroke-width:1.4;stroke-linejoin:round}
.banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 40%);z-index:45;transform:translate(-50%,-50%) scale(.6);
  opacity:0;pointer-events:none;background:var(--paper);border:4px solid var(--sun-deep);border-radius:32px;box-shadow:0 8px 0 var(--sun-deep);
  padding:20px 34px 22px;text-align:center;transition:opacity .25s, transform .35s cubic-bezier(.3,1.7,.5,1);width:max-content;max-width:calc(100vw - 32px)}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner-art{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:6px}
.banner-art svg{height:clamp(70px,14vw,130px);width:auto;overflow:visible}
.banner-art.row svg{height:clamp(46px,9vw,84px)}
.banner-art .star-big{height:clamp(46px,8vw,70px);fill:var(--sun);stroke:var(--sun-deep);stroke-width:1.4;stroke-linejoin:round}
.banner-big{font:700 clamp(30px,5.5vw,50px)/1.1 var(--f-play);text-wrap:balance}
.banner-small{font:600 clamp(18px,3vw,24px)/1.3 var(--f-play);color:var(--good-deep);margin-top:6px;text-wrap:balance}

@keyframes tokin{from{opacity:0;transform:translateY(26px) scale(.4)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-14px) rotate(-3deg)}30%{transform:translateX(12px) rotate(3deg)}45%{transform:translateX(-9px)}60%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes nudge{0%,100%{transform:none}50%{transform:scale(1.08)}}
@keyframes blink{to{visibility:hidden}}
@keyframes eyeblink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes pillin{from{opacity:0;transform:translateY(8px) scale(.7)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes markpop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.06,.9)}50%{transform:translateY(-18px) scale(.97,1.05)}80%{transform:translateY(0) scale(1.05,.93)}}
@keyframes arrive{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes idlehop{0%,70%,100%{transform:translateY(0) scale(1,1)}76%{transform:translateY(0) scale(1.06,.9)}86%{transform:translateY(-22%) scale(.96,1.05)}95%{transform:translateY(0) scale(1.05,.92)}}
@keyframes tentick{from{stroke:var(--ink)}to{stroke:var(--hop2)}}
@keyframes tennum{from{fill:var(--ink)}to{fill:var(--hop2)}}

@media (max-width:760px){
  .play{grid-template-columns:minmax(0,1fr)}
  .pad{grid-template-columns:repeat(3,minmax(0,1fr))}
  .new-btn{align-self:stretch}
}
@media (max-width:640px){
  .modes{grid-template-columns:minmax(0,1fr)}
  .line-panel{padding:22px 8px 2px}
  .mode-pill{display:none}
  .tribune-wrap{order:5;flex-basis:100%}
  .bar > .stars{margin-left:auto}
  #tribune{height:60px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="star" viewBox="0 0 24 24">
      <path d="M12 2.2l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 16.9 6.1 20.1l1.3-6.5L2.5 9l6.6-.8z"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <!-- Startskjerm -->
  <section id="start" class="start">
    <h1 class="wordmark">Hoppe<span>dyrene</span></h1>
    <div class="hero-row" id="heroRow" aria-label="Dyrene du kan samle"></div>
    <p class="lead" id="heroLead">Få fem stjerner, så kommer et nytt dyr. Velg et spill:</p>
    <div class="modes">
      <button class="mode-card" data-mode="ti" id="modeTi">
        <span class="mode-name">Opp til 10</span>
        <span class="mode-ex"><span class="a">4</span><span>+</span><span class="b">3</span></span>
        <svg class="mini" id="miniTi" viewBox="0 0 240 64" aria-hidden="true"></svg>
        <span class="mode-note">Svaret er aldri mer enn 10.</span>
      </button>
      <button class="mode-card" data-mode="over" id="modeOver">
        <span class="mode-name">Over 10</span>
        <span class="mode-ex"><span class="a">8</span><span>+</span><span class="b">5</span></span>
        <svg class="mini" id="miniOver" viewBox="0 0 240 64" aria-hidden="true"></svg>
        <span class="mode-note">Tieroverganger: dyret hopper forbi 10.</span>
      </button>
    </div>
  </section>

  <!-- Spillskjerm -->
  <section id="game" class="game" hidden>
    <header class="bar">
      <button class="back" id="backBtn" type="button">‹ Bytt spill</button>
      <span class="mode-pill" id="modePill">Opp til 10</span>
      <div class="tribune-wrap"><svg id="tribune" viewBox="0 -26 104 146" role="img" aria-label="Dyrene som ser på"></svg></div>
      <div class="stars" id="stars" aria-label="Stjerner">
        <svg class="star-ico" id="starIcon" viewBox="0 0 24 24" aria-hidden="true"><use href="#star"/></svg><span id="starCount">0</span>
        <span class="pips" id="pips" aria-hidden="true"></span>
      </div>
    </header>

    <div class="line-panel">
      <svg id="line" viewBox="0 -20 1000 285" role="img" aria-label="Tallinje"></svg>
    </div>

    <div class="play">
      <div class="task-col">
        <div class="task-card" id="card"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <button class="new-btn pulse" id="newBtn" type="button">Ny oppgave</button>
      </div>
      <div class="pad off" id="pad" aria-label="Talltastatur">
        <button class="key" type="button" data-k="1">1</button>
        <button class="key" type="button" data-k="2">2</button>
        <button class="key" type="button" data-k="3">3</button>
        <button class="key" type="button" data-k="4">4</button>
        <button class="key" type="button" data-k="5">5</button>
        <button class="key" type="button" data-k="6">6</button>
        <button class="key" type="button" data-k="7">7</button>
        <button class="key" type="button" data-k="8">8</button>
        <button class="key" type="button" data-k="9">9</button>
        <button class="key del" type="button" data-k="del" aria-label="Slett">⌫</button>
        <button class="key" type="button" data-k="0">0</button>
        <button class="key ok" type="button" data-k="ok">OK</button>
      </div>
    </div>
  </section>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="banner" id="banner" aria-live="polite">
  <div class="banner-art" id="bannerArt"></div>
  <div class="banner-big" id="bannerBig"></div>
  <div class="banner-small" id="bannerSmall"></div>
</div>

  }
  function del(){
    if (state.phase !== 'answer') return;
    state.entry = state.entry.slice(0, -1); renderEntry();
  }
  function check(){
    if (state.phase !== 'answer') return;
    if (!state.entry){
      answerEl.classList.remove('nudge'); void answerEl.offsetWidth; answerEl.classList.add('nudge');
      return;
    }
    if (parseInt(state.entry, 10) === state.task.a + state.task.b) correct(); else wrong();
  }

  async function wrong(){
    state.phase = 'busy'; state.attempts++;
    renderEntry();
    answerEl.classList.remove('wrong', 'nudge'); void answerEl.offsetWidth; answerEl.classList.add('wrong');
    const {a, b} = state.task;
    let hint = '';
    if (state.attempts >= 2){
      if (state.max > 10){
        hint = `Fra ${a} er det ${10 - a} hopp til 10. Du skal hoppe ${b} ganger i alt. Hvor mange hopp er igjen etter 10?`;
        lineSvg.classList.add('hint10');
      } else {
        hint = `Finn ${a} på tallinja di. Hopp ${b} ${b === 1 ? 'gang' : 'ganger'} fram.`;
      }
    }
    setFeedback('try', 'Prøv igjen!', hint);
    await wait(750);
    answerEl.classList.add('fade');
    await wait(320);
    state.entry = '';
    answerEl.classList.remove('wrong', 'fade');
    state.phase = 'answer';
    renderEntry();
  }

  async function correct(){
    state.phase = 'busy'; setBusy(true); setPad(false);
    renderEntry();
    const {a, b} = state.task;
    answerEl.classList.remove('nudge', 'wrong');
    answerEl.classList.add('right');
    setFeedback('good', 'Riktig!');
    lineSvg.classList.remove('hint10');
    await wait(300);
    const per = Math.max(270, Math.min(430, 2600 / b));
    const H = state.max > 10 ? 52 : 64;
    for (let i = 1; i <= b; i++){
      const drawArc = addArc(a + i - 1, a + i, i);
      await hop(a + i - 1, a + i, H, per, drawArc);
      state.k = a + i;
    }
    mark(a + b, 'end');
    cheer();
    await wait(280);
    await flyStar();
    state.stars++;
    starCount.textContent = state.stars;
    starsEl.classList.remove('bump'); void starsEl.offsetWidth; starsEl.classList.add('bump');
    setPip(state.stars % 5 === 0 ? 5 : state.stars % 5);

    if (state.stars % 5 === 0){
      const level = state.stars / 5;
      if (state.collected < 5 && level === state.collected + 1){
        if (level < 5) await newFriend(level); else await finale();
      } else {
        await celebrate();
      }
      renderPips(0);
    }
    await wait(250);
    await exitTask();
    setIdleCard(); setFeedback('');
    state.phase = 'idle'; setBusy(false);
    newBtn.disabled = false; newBtn.classList.add('pulse');
  }

  function flyStar(){
    const s = document.createElement('div');
    s.className = 'flystar';
    s.innerHTML = '<svg viewBox="0 0 24 24"><use href="#star"/></svg>';
    document.body.appendChild(s);
    const r1 = answerEl.getBoundingClientRect(), r2 = starIcon.getBoundingClientRect();
    const x1 = r1.left + r1.width/2 - 24, y1 = r1.top + r1.height/2 - 24;
    const x2 = r2.left + r2.width/2 - 24, y2 = r2.top + r2.height/2 - 24;
    const mx = (x1 + x2)/2 - 40, my = Math.max(8, (y1 + y2)/2 - 70);
    const anim = s.animate([
      {transform:`translate(${x1}px,${y1}px) scale(.3) rotate(0deg)`, opacity:0},
      {transform:`translate(${x1}px,${y1 - 40}px) scale(1.4) rotate(50deg)`, opacity:1, offset:.28},
      {transform:`translate(${mx}px,${my}px) scale(1.2) rotate(150deg)`, opacity:1, offset:.62},
      {transform:`translate(${x2}px,${y2}px) scale(.75) rotate(216deg)`, opacity:1}
    ], {duration: reduced ? 1 : 950, easing:'ease-in-out'});
    return anim.finished.catch(() => {}).then(() => s.remove());
  }

  async function exitTask(){
    const toks = [...card.querySelectorAll('.tok')];
    if (reduced || !toks.length) return;
    const anims = toks.map((t, i) => t.animate([
      {transform:'none', opacity:1},
      {transform:'translateY(-14px) scale(1.15)', opacity:1, offset:.35},
      {transform:'translateY(-60px) scale(.5) rotate(12deg)', opacity:0}
    ], {duration:420, delay:i*70, easing:'cubic-bezier(.5,0,.75,0)', fill:'forwards'}));
    await Promise.all(anims.map(a => a.finished.catch(() => {})));
  }

  function showBanner(art, big, small, rowClass){
    bannerArt.className = 'banner-art' + (rowClass ? ' row' : '');
    bannerArt.innerHTML = art; bannerBig.textContent = big; bannerSmall.textContent = small;
    banner.classList.add('show');
  }
  function hideBanner(){ banner.classList.remove('show'); }

  async function flipJump(){
    const x = xOf(state.k);
    await tween(950, t => {
      const e = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
      setRoo(x, -90 * 4 * t * (1 - t), 1, 1, 360 * e);
    });
    setRoo(x, 0, 1, 1, 0);
  }

  // Vanlig feiring (etter at alle dyrene er samlet)
  async function celebrate(){
    showBanner('<svg class="star-big" viewBox="0 0 24 24"><use href="#star"/></svg>', `${state.stars} stjerner!`, 'Kjempebra!');
    confetti(); cheer();
    await flipJump();
    await wait(1100);
    hideBanner(); await wait(250);
  }

  // Nytt dyr: det gamle setter seg på tribunen, det nye hopper inn på tallinja.
  async function newFriend(i){
    const prev = state.hopper;
    showBanner(animalSvg(i), `Ny venn: ${ANIMALS[i].name}!`, `${ANIMALS[prev].def} setter seg og ser på.`);
    confetti();
    const x = xOf(state.k);
    await tween(420, t => setRoo(x, -50 * t, 1 - t, 1 - t, 0));
    state.collected = i; state.hopper = i; state.dir = 1;
    buildHopper();
    setRoo(x, 0, 0, 0, 0);
    renderTribune(prev);
    await tween(560, t => { const s = Math.max(0, backOut(t)); setRoo(x, 0, s, s, 0); });
    setRoo(x, 0, 1, 1, 0);
    await wait(500);
    cheer();
    await wait(1300);
    hideBanner(); await wait(250);
  }

  // Alle fem dyrene er samlet.
  async function finale(){
    state.collected = 5;
    const row = ANIMALS.map((a, i) => animalSvg(i)).join('');
    showBanner(row, 'Du har samlet alle dyrene!', 'Trykk på et dyr oppe til høyre for å bytte hopper.', true);
    confetti();
    renderTribune(-1);
    cheer();
    await flipJump();
    cheer();
    await wait(2200);
    hideBanner(); await wait(250);
  }

  async function swapHopper(i){
    if (state.phase === 'busy' || state.collected < 5 || i === state.hopper) return;
    const prevPhase = state.phase;
    state.phase = 'busy'; setBusy(true);
    const wasPad = !pad.classList.contains('off');
    setPad(false);
    const x = xOf(state.k);
    await tween(300, t => setRoo(x, -30 * t, 1 - t, 1 - t, 0));
    state.hopper = i; state.dir = 1;
    buildHopper(); setRoo(x, 0, 0, 0, 0);
    renderTribune(-1);
    await tween(480, t => { const s = Math.max(0, backOut(t)); setRoo(x, 0, s, s, 0); });
    setRoo(x, 0, 1, 1, 0);
    state.phase = prevPhase; setBusy(false);
    if (wasPad) setPad(true);
    renderEntry();
  }

  function confetti(){
    if (reduced) return;
    const c = $('#confetti'), ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
    const W = innerWidth, H = innerHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#FFC83A', '#2F7FE0', '#E0457B', '#22A15E', '#EF8418'];
    const P = Array.from({length:90}, (_, i) => ({
      x: W/2 + (Math.random() - .5) * W * .3, y: H * .3,
      vx: (Math.random() - .5) * 15, vy: -Math.random() * 12 - 5,
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
      w: 8 + Math.random() * 8, h: 5 + Math.random() * 5, c: cols[i % cols.length]
    }));
    const t0 = performance.now(), D = 2600;
    const f = now => {
      const t = now - t0;
      ctx.clearRect(0, 0, W, H);
      for (const p of P){
        p.vy += .34; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, 1 - t / D);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      }
      if (t < D) requestAnimationFrame(f); else ctx.clearRect(0, 0, W, H);
    };
    requestAnimationFrame(f);
  }

  /* ---------- skjermbytte ---------- */
  function startMode(m){
    state.mode = m; state.max = m === 'over' ? 20 : 10;
    state.bag = []; state.last = null; state.k = 0; state.dir = 1;
    state.phase = 'idle'; state.task = null; state.entry = '';
    modePill.textContent = m === 'over' ? 'Over 10' : 'Opp til 10';
    startEl.hidden = true; gameEl.hidden = false;
    buildLine(); renderTribune(-1); renderPips(state.stars % 5);
    setIdleCard(); setFeedback(''); setPad(false); setBusy(false);
    newBtn.disabled = false; newBtn.classList.add('pulse');
    window.scrollTo(0, 0);
  }
  function showStart(){
    if (state.phase === 'busy') return;
    state.phase = 'idle';
    renderHero();
    gameEl.hidden = true; startEl.hidden = false;
    window.scrollTo(0, 0);
  }

  /* ---------- hendelser ---------- */
  document.querySelectorAll('.mode-card').forEach(b => b.addEventListener('click', () => startMode(b.dataset.mode)));
  backBtn.addEventListener('click', showStart);
  newBtn.addEventListener('click', newTask);
  trib.addEventListener('click', e => {
    const p = e.target.closest('[data-pick]');
    if (p) swapHopper(+p.getAttribute('data-pick'));
  });
  pad.addEventListener('click', e => {
    const k = e.target.closest('.key');
    if (!k || k.disabled) return;
    const v = k.dataset.k;
    if (v === 'del') del(); else if (v === 'ok') check(); else typeDigit(v);
  });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || gameEl.hidden) return;
    if (/^[0-9]$/.test(e.key)){ e.preventDefault(); typeDigit(e.key); return; }
    if (e.key === 'Backspace'){ e.preventDefault(); del(); return; }
    if (e.key === 'Enter'){
      const ae = document.activeElement;
      if (ae && ae.tagName === 'BUTTON' && !pad.contains(ae) && ae !== newBtn) return;
      e.preventDefault();
      if (state.phase === 'answer') check(); else if (state.phase === 'idle') newTask();
    }
  });

  renderHero();
})();
</script>

</body></html>
